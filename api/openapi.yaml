openapi: 3.1.0
info:
  title: Surtido API
  version: 0.1.0
  description: |
    API REST de la app móvil de gestión de inventarios para micronegocios.

    - Todas las rutas van bajo `/api/v1` y usan JSON.
    - Los errores siempre tienen el cuerpo `{ code, message }`: `code` es estable y en inglés
      (la app decide qué hacer con él) y `message` está en español, listo para mostrar al usuario.
    - Las rutas protegidas exigen `Authorization: Bearer <token>`. Las únicas públicas son
      `/auth/*` y `/health`.

    Este documento solo incluye los endpoints ya implementados.
servers:
  - url: https://surtido-api.vercel.app/api/v1
    description: Producción
  - url: http://localhost:3000/api/v1
    description: Desarrollo local
security:
  - bearerAuth: []
tags:
  - name: Reports
    description: Resumen de ventas y reportes en Excel
  - name: Health
    description: Estado del servicio
  - name: Auth
    description: Registro, inicio de sesión y restablecimiento de la contraseña del comerciante
  - name: Products
    description: Productos del inventario del negocio
  - name: Movements
    description: Entradas, salidas y ajustes de existencias

paths:
  /health:
    get:
      tags: [Health]
      summary: Verifica que la API está en línea
      operationId: getHealth
      security: []
      responses:
        "200":
          description: La API responde.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
              example:
                status: ok

  /auth/register:
    post:
      tags: [Auth]
      summary: Registra la cuenta de un negocio (RF-01)
      description: |
        Crea el negocio y su usuario en una sola operación y deja la sesión abierta:
        la respuesta ya trae el token.

        - El correo se guarda sin espacios y en minúsculas, y es único en todo el sistema.
        - La contraseña se guarda solo como hash.
        - Se registra la fecha en que se aceptó la política de datos.
      operationId: registerAccount
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            example:
              businessName: Tienda Doña Rosa
              ownerName: Rosa Martínez
              email: rosa@correo.com
              password: secreta123
              passwordConfirmation: secreta123
              acceptDataPolicy: true
      responses:
        "201":
          description: Cuenta creada. La sesión queda abierta con el token devuelto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
              example:
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJidXNpbmVzc0lkIjoiLi4uIiwic3ViIjoiLi4uIn0.firma
                user:
                  ownerName: Rosa Martínez
                  email: rosa@correo.com
                business:
                  name: Tienda Doña Rosa
        "400":
          description: |
            La petición no se puede procesar:

            - `VALIDATION_ERROR`: falta un campo, sobra un campo, un valor no cumple el formato
              o la confirmación no coincide con la contraseña. No se indica qué campo falló:
              la app valida campo a campo antes de enviar.
            - `INVALID_JSON`: el cuerpo no es un JSON válido.
            - `DATA_POLICY_NOT_ACCEPTED`: `acceptDataPolicy` llegó en `false`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                validationError:
                  $ref: "#/components/examples/ValidationError"
                invalidJson:
                  $ref: "#/components/examples/InvalidJson"
                dataPolicyNotAccepted:
                  summary: Política de datos no aceptada
                  value:
                    code: DATA_POLICY_NOT_ACCEPTED
                    message: Debes aceptar la política de datos para continuar.
        "409":
          description: Ya existe una cuenta con ese correo (sin importar mayúsculas ni espacios).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: EMAIL_ALREADY_REGISTERED
                message: Ya existe una cuenta con este correo. Inicia sesión o usa otro correo.
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/login:
    post:
      tags: [Auth]
      summary: Inicia sesión con correo y contraseña (RF-02)
      description: |
        Verifica las credenciales del comerciante y devuelve un token nuevo junto con los datos
        básicos del usuario y del negocio. La respuesta tiene la misma forma que la de
        `/auth/register`.

        - El correo se compara sin espacios y sin distinguir mayúsculas.
        - Si el correo no existe o la contraseña no coincide, la respuesta es la misma
          (`INVALID_CREDENTIALS`), para no revelar qué correos están registrados.
        - Después de 5 intentos fallidos seguidos, el correo queda bloqueado 15 minutos, tenga o
          no una cuenta. Los intentos se olvidan al iniciar sesión, a los 15 minutos sin fallar o
          al restablecer la contraseña.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: rosa@correo.com
              password: secreta123
      responses:
        "200":
          description: Credenciales válidas. La sesión queda abierta con el token devuelto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
              example:
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJidXNpbmVzc0lkIjoiLi4uIiwic3ViIjoiLi4uIn0.firma
                user:
                  ownerName: Rosa Martínez
                  email: rosa@correo.com
                business:
                  name: Tienda Doña Rosa
        "400":
          description: |
            La petición no se puede procesar:

            - `VALIDATION_ERROR`: falta un campo, sobra un campo, el correo no tiene formato
              válido o la contraseña llegó vacía.
            - `INVALID_JSON`: el cuerpo no es un JSON válido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                validationError:
                  $ref: "#/components/examples/ValidationError"
                invalidJson:
                  $ref: "#/components/examples/InvalidJson"
        "401":
          description: El correo no está registrado o la contraseña es incorrecta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: INVALID_CREDENTIALS
                message: Correo o contraseña incorrectos.
        "429":
          description: Demasiados intentos fallidos con este correo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: TOO_MANY_LOGIN_ATTEMPTS
                message: Demasiados intentos fallidos. Espera 15 minutos o restablece tu contraseña.
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/password-reset/request:
    post:
      tags: [Auth]
      summary: Envía un código para restablecer la contraseña (RF-04)
      description: |
        Envía al correo un código de 6 dígitos para cambiar la contraseña.

        - Responde 204 exista o no la cuenta, para no revelar qué correos están registrados.
        - El código vence en 15 minutos, sirve una sola vez y se guarda solo como hash.
        - Pedir un código nuevo anula el anterior. Si se pidió otro hace menos de un minuto,
          no se envía nada, pero la respuesta también es 204.
        - El correo se envía con el proveedor de `EMAIL_PROVIDER`. Sin proveedor, en desarrollo
          se escribe en la consola del servidor; en producción responde 500 `EMAIL_NOT_SENT`.
      operationId: requestPasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
            example:
              email: rosa@correo.com
      responses:
        "204":
          description: Si el correo tiene una cuenta, el código va en camino.
        "400":
          description: |
            - `VALIDATION_ERROR`: falta el correo, sobra un campo o el correo no tiene formato válido.
            - `INVALID_JSON`: el cuerpo no es un JSON válido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                validationError:
                  $ref: "#/components/examples/ValidationError"
                invalidJson:
                  $ref: "#/components/examples/InvalidJson"
        "500":
          description: |
            - `EMAIL_NOT_SENT`: el proveedor de correo no respondió o rechazó el envío. Se puede
              pedir otro código de inmediato.
            - `INTERNAL_ERROR`: error inesperado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: EMAIL_NOT_SENT
                message: No pudimos enviar el correo. Intenta de nuevo en unos minutos.

  /auth/password-reset/confirm:
    post:
      tags: [Auth]
      summary: Cambia la contraseña con el código recibido (RF-04)
      description: |
        Cambia la contraseña si el código es el último enviado al correo, no ha vencido y no se
        ha usado. No abre sesión: la app lleva al inicio de sesión.

        - Después de 5 intentos con un código equivocado, el código deja de servir.
        - Cualquier falla responde `INVALID_RESET_CODE`, sin indicar si el correo existe.
      operationId: confirmPasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConfirm"
            example:
              email: rosa@correo.com
              code: "482915"
              newPassword: nuevaClave99
      responses:
        "204":
          description: La contraseña cambió.
        "400":
          description: |
            - `INVALID_RESET_CODE`: el código es incorrecto, venció, ya se usó, se agotaron los
              intentos o el correo no tiene cuenta.
            - `VALIDATION_ERROR`: el código no tiene 6 dígitos, la contraseña nueva tiene menos
              de 8 caracteres, falta o sobra un campo.
            - `INVALID_JSON`: el cuerpo no es un JSON válido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalidResetCode:
                  summary: Código inválido
                  value:
                    code: INVALID_RESET_CODE
                    message: El código no es válido o ya venció. Pide uno nuevo.
                validationError:
                  $ref: "#/components/examples/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  /products:
    get:
      tags: [Products]
      summary: Lista el inventario del negocio (RF-14)
      description: |
        Devuelve todos los productos **activos** del negocio del token, en orden alfabético por
        nombre, cada uno con su estado de existencias. No se pagina: el inventario de un
        micronegocio cabe en una respuesta (hasta 500 productos en menos de 1 s, RR-04).
      operationId: listInventory
      parameters:
        - name: search
          in: query
          required: false
          description: Filtra por nombre, sin distinguir mayúsculas. Se ignoran los espacios al inicio y al final.
          schema:
            type: string
            maxLength: 80
          example: arroz
      responses:
        "200":
          description: Productos del inventario. Un arreglo vacío si no hay coincidencias.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryProduct"
              example:
                - id: 8b2e4d1a-6c3f-4a9e-b1d7-5f0e2c3a4b6d
                  name: Arroz Diana 500 g
                  unit: UNIT
                  stock: 24
                  salePrice: 3500
                  minStock: 6
                  codeType: GTIN
                  code: "7702004003508"
                  status: OK
                - id: 3f1c2b9e-8a4d-4c1e-9b7a-2d5e6f708192
                  name: Jabón de baño
                  unit: UNIT
                  stock: 0
                  salePrice: 4200
                  minStock: 3
                  codeType: INTERNAL
                  code: INV-7KQ2M9XA4T
                  status: OUT_OF_STOCK
        "400":
          description: "`VALIDATION_ERROR`: `search` tiene más de 80 caracteres o llegó un parámetro desconocido."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                validationError:
                  $ref: "#/components/examples/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Products]
      summary: Registra un producto con o sin código de barras (RF-05, RF-06)
      description: |
        Crea un producto en el negocio del token. El negocio nunca se envía en el cuerpo.

        - **Con `code`:** es un código de barras (GTIN) de 8 o 13 dígitos. La app normaliza
          los UPC antes de enviarlos (UPC-A → 13 dígitos con un 0 delante). El backend vuelve a
          validar el dígito de control.
        - **Sin `code`:** el backend genera un identificador interno `INV-` + 10 caracteres,
          que la app usa para imprimir el QR.
        - Si `stock` es mayor que 0, se registra a la vez un movimiento de entrada con esa
          cantidad, para que el historial del producto empiece completo.
        - `stock`, `salePrice` y `minStock` admiten máximo 2 decimales. Con `unit: UNIT`, el
          `stock` debe ser entero.
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRequest"
            examples:
              withBarcode:
                summary: Con código de barras
                value:
                  name: Arroz Diana 500 g
                  unit: UNIT
                  stock: 24
                  salePrice: 3500
                  minStock: 6
                  code: "7702004003508"
              withoutCode:
                summary: Sin código (el backend genera el identificador interno)
                value:
                  name: Queso campesino
                  unit: KILOGRAM
                  stock: 2.5
                  salePrice: 22000
      responses:
        "201":
          description: Producto creado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
              example:
                id: 3f1c2b9e-8a4d-4c1e-9b7a-2d5e6f708192
                name: Queso campesino
                unit: KILOGRAM
                stock: 2.5
                salePrice: 22000
                minStock: null
                codeType: INTERNAL
                code: INV-7KQ2M9XA4T
        "400":
          description: |
            La petición no se puede procesar:

            - `VALIDATION_ERROR`: falta un campo, sobra un campo (por ejemplo `businessId` o
              `codeType`), el nombre no mide entre 2 y 80 caracteres, la unidad no existe o
              una cantidad es negativa.
            - `INVALID_GTIN`: el código no es un GTIN de 8 o 13 dígitos con dígito de control
              válido.
            - `INVALID_QUANTITY`: una cantidad tiene más de 2 decimales, o el `stock` no es
              entero con `unit: UNIT`.
            - `INVALID_JSON`: el cuerpo no es un JSON válido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                validationError:
                  $ref: "#/components/examples/ValidationError"
                invalidGtin:
                  summary: Código de barras inválido
                  value:
                    code: INVALID_GTIN
                    message: El código de barras no es válido. Escanéalo de nuevo.
                invalidQuantity:
                  summary: Cantidad inválida
                  value:
                    code: INVALID_QUANTITY
                    message: "Revisa las cantidades: usa máximo 2 decimales y números enteros si vendes por unidad."
                invalidJson:
                  $ref: "#/components/examples/InvalidJson"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: |
            El código de barras ya está registrado en este negocio:

            - `CODE_ALREADY_REGISTERED`: es de un producto activo. Para abrirlo, la app lo busca
              por código (flujo de identificación).
            - `CODE_OF_DELETED_PRODUCT`: es de un producto eliminado. El código sigue ocupado,
              porque el producto conserva su historial.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                alreadyRegistered:
                  summary: Producto activo
                  value:
                    code: CODE_ALREADY_REGISTERED
                    message: Ya existe un producto con este código en tu negocio.
                deletedProduct:
                  summary: Producto eliminado
                  value:
                    code: CODE_OF_DELETED_PRODUCT
                    message: Este código es de un producto que eliminaste. Puedes restaurarlo desde Productos eliminados.
        "500":
          $ref: "#/components/responses/InternalError"

  /products/code/{code}:
    get:
      tags: [Products]
      summary: Identifica un producto por el código escaneado con la cámara (RF-09)
      description: |
        Busca el producto **activo** del negocio del token cuyo código coincide exactamente con
        el escaneado. Sirve tanto para códigos de barras como para los QR que genera la app.

        - **Código de barras (GTIN):** 8, 12 o 13 dígitos con dígito de control válido. La app
          debe enviarlo normalizado igual que al registrarlo (UPC-A → 13 dígitos con un 0
          delante); si no, no coincidirá con el código guardado.
        - **QR interno:** `INV-` + 10 caracteres en base32 Crockford (mayúsculas).
        - Cualquier otro contenido de hasta 32 caracteres (texto, una URL corta, etc.) responde
          404 sin consultar el inventario. Si pasa de 32 caracteres, responde 400.

        Los productos dados de baja o de otro negocio responden igual que uno inexistente.
      operationId: identifyProduct
      parameters:
        - name: code
          in: path
          required: true
          description: Contenido leído por la cámara.
          schema:
            type: string
            minLength: 1
            maxLength: 32
          examples:
            gtin:
              summary: Código de barras
              value: "7702004003508"
            internal:
              summary: QR interno
              value: INV-7KQ2M9XA4T
      responses:
        "200":
          description: Producto encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
              example:
                id: 8b2e4d1a-6c3f-4a9e-b1d7-5f0e2c3a4b6d
                name: Arroz Diana 500 g
                unit: UNIT
                stock: 24
                salePrice: 3500
                minStock: 6
                codeType: GTIN
                code: "7702004003508"
        "400":
          description: |
            `VALIDATION_ERROR`: el código está vacío o tiene más de 32 caracteres. Los espacios
            al inicio y al final se ignoran.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                validationError:
                  $ref: "#/components/examples/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: |
            `CODE_NOT_RECOGNIZED`: el código no corresponde a un producto activo del negocio.
            Ocurre si el código no tiene un formato reconocido, si no está registrado, si el
            producto fue dado de baja o si pertenece a otro negocio.

            La app decide qué hacer según lo que escaneó: si era un código de barras válido,
            ofrece registrar el producto con ese código; si no, muestra el `message`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: CODE_NOT_RECOGNIZED
                message: Este código no corresponde a un producto de tu inventario.
        "500":
          $ref: "#/components/responses/InternalError"

  /movements:
    post:
      tags: [Movements]
      summary: Registra una entrada, una salida o un ajuste de existencias (RF-11 a RF-13)
      description: |
        Es la única forma de cambiar la existencia de un producto. El movimiento y la nueva
        existencia se guardan juntos: si algo falla, no cambia ninguno de los dos.

        | `type` | `quantity` que se envía | `reason` | Nueva existencia |
        | --- | --- | --- | --- |
        | `INBOUND` | Lo que entra, mayor que 0 | No se envía | existencia + cantidad |
        | `OUTBOUND` | Lo que sale, mayor que 0 | Obligatorio: `SALE`, `CONSUMPTION` o `LOSS` | existencia − cantidad |
        | `ADJUSTMENT` | Lo **contado** en el conteo físico, mayor o igual a 0 | No se envía | lo contado |

        - Las cantidades admiten máximo 2 decimales y deben ser enteras si el producto se vende
          por unidad (`UNIT`).
        - En un ajuste, el movimiento guarda la **diferencia** entre lo contado y la existencia
          anterior (puede ser negativa).
        - **Idempotencia:** la app genera un UUID nuevo en `idempotencyKey` por cada acción del
          usuario y lo reutiliza si reintenta la misma petición. Si la clave ya se usó, se
          devuelve el movimiento que ya existía (200) y la existencia no cambia dos veces.
      operationId: registerMovement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterMovementRequest"
            examples:
              sale:
                summary: Venta
                value:
                  productId: 3f1c2b9e-8a4d-4c1e-9b7a-2d5e6f708192
                  type: OUTBOUND
                  quantity: 2
                  reason: SALE
                  idempotencyKey: 9b7a2d5e-6f70-4192-8a4d-3f1c2b9e4c1e
              inbound:
                summary: Entrada de mercancía
                value:
                  productId: 3f1c2b9e-8a4d-4c1e-9b7a-2d5e6f708192
                  type: INBOUND
                  quantity: 12
                  idempotencyKey: 1e4c9b7a-2d5e-4f70-8192-3f1c2b9e8a4d
              adjustment:
                summary: Ajuste por conteo físico
                value:
                  productId: 3f1c2b9e-8a4d-4c1e-9b7a-2d5e6f708192
                  type: ADJUSTMENT
                  quantity: 7
                  idempotencyKey: 8a4d3f1c-2b9e-4c1e-9b7a-2d5e6f708192
      responses:
        "201":
          description: Movimiento registrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovementResult"
              example:
                movement:
                  id: 5e6f7081-92a4-4d1c-8b9e-3f1c2b9e4c1e
                  productId: 3f1c2b9e-8a4d-4c1e-9b7a-2d5e6f708192
                  type: OUTBOUND
                  reason: SALE
                  quantity: 2
                  resultingStock: 22
                  createdAt: "2026-11-08T15:30:00.000Z"
                stock: 22
        "200":
          description: |
            No se registró un movimiento nuevo, en uno de dos casos:

            - **Reintento:** la `idempotencyKey` ya se usó. `movement` es el que ya existía y
              `stock` es la existencia que dejó ese movimiento.
            - **Ajuste sin diferencia:** lo contado coincide con la existencia. `movement` es
              `null` y `stock` es la existencia, que no cambió.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovementResult"
              example:
                movement: null
                stock: 7
        "400":
          description: |
            La petición no se puede procesar:

            - `VALIDATION_ERROR`: falta un campo, sobra uno, `productId` o `idempotencyKey` no
              son UUID, el tipo o el motivo no existen, falta `reason` en una salida o llega en
              una entrada o un ajuste.
            - `INVALID_QUANTITY`: la cantidad tiene más de 2 decimales, no es entera con
              `UNIT`, o es 0 en una entrada o una salida.
            - `INVALID_JSON`: el cuerpo no es un JSON válido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                validationError:
                  $ref: "#/components/examples/ValidationError"
                invalidQuantity:
                  summary: Cantidad inválida
                  value:
                    code: INVALID_QUANTITY
                    message: "Revisa las cantidades: usa máximo 2 decimales y números enteros si vendes por unidad."
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: |
            `PRODUCT_NOT_FOUND`: el producto no existe, fue dado de baja o pertenece a otro
            negocio. Los tres casos responden igual.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: PRODUCT_NOT_FOUND
                message: Este producto no está en tu inventario.
        "409":
          description: |
            - `INSUFFICIENT_STOCK`: la salida es mayor que la existencia. No cambia nada; la
              app puede ofrecer registrar un ajuste.
            - `IDEMPOTENCY_KEY_CONFLICT`: la `idempotencyKey` no se puede usar. No ocurre si la
              app genera un UUID nuevo por cada acción.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                insufficientStock:
                  summary: Existencia insuficiente
                  value:
                    code: INSUFFICIENT_STOCK
                    message: No hay existencias suficientes para esta salida. Revisa la cantidad o haz un ajuste.
                idempotencyKeyConflict:
                  summary: Clave de idempotencia no válida
                  value:
                    code: IDEMPOTENCY_KEY_CONFLICT
                    message: No pudimos registrar el movimiento. Intenta de nuevo.
        "500":
          $ref: "#/components/responses/InternalError"

  /products/deleted:
    get:
      tags: [Products]
      summary: Productos eliminados del negocio (RF-08)
      description: |
        Productos que se pueden restaurar, del eliminado más reciente al más antiguo. Con `code`,
        solo el producto eliminado con ese código, para ofrecer restaurarlo al escanearlo.
      operationId: listDeletedProducts
      parameters:
        - name: code
          in: query
          required: false
          description: Código de barras o identificador interno exacto.
          schema:
            type: string
            minLength: 1
            maxLength: 32
      responses:
        "200":
          description: Lista de productos eliminados; vacía si no hay.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeletedProduct"
              example:
                - id: 3f1c2b9e-8a4d-4c1e-9b7a-2d5e6f708192
                  name: Panela
                  unit: UNIT
                  stock: 4
                  salePrice: 3000
                  minStock: 2
                  codeType: INTERNAL
                  code: INV-7KQ2M9XA4T
                  deletedAt: "2026-11-08T15:30:00.000Z"
        "400":
          description: "`VALIDATION_ERROR`: el código está vacío o tiene más de 32 caracteres."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                validationError:
                  $ref: "#/components/examples/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /products/{id}/restore:
    post:
      tags: [Products]
      summary: Restaura un producto eliminado (RF-08)
      description: |
        Devuelve el producto al inventario con la existencia y el historial que tenía. Si ya está
        activo, responde igual, así un reintento no falla.
      operationId: restoreProduct
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: El producto, ya activo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
              example:
                id: 3f1c2b9e-8a4d-4c1e-9b7a-2d5e6f708192
                name: Panela
                unit: UNIT
                stock: 4
                salePrice: 3000
                minStock: 2
                codeType: INTERNAL
                code: INV-7KQ2M9XA4T
        "400":
          description: "`VALIDATION_ERROR`: el id no es un UUID."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                validationError:
                  $ref: "#/components/examples/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ProductNotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /products/low-stock:
    get:
      tags: [Products]
      summary: Productos agotados o por agotarse (RF-16)
      description: |
        Productos activos del negocio que necesitan reposición: primero los agotados
        (`OUT_OF_STOCK`) y después los que están en su existencia mínima o por debajo
        (`LOW_STOCK`), cada grupo en orden alfabético. La app muestra el contador en la
        pantalla principal con la cantidad de elementos.

        Un producto sin `minStock` solo aparece si se agota.
      operationId: getLowStockAlerts
      responses:
        "200":
          description: Productos que necesitan atención. Un arreglo vacío si ninguno.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryProduct"
              example:
                - id: 3f1c2b9e-8a4d-4c1e-9b7a-2d5e6f708192
                  name: Jabón de baño
                  unit: UNIT
                  stock: 0
                  salePrice: 4200
                  minStock: 3
                  codeType: INTERNAL
                  code: INV-7KQ2M9XA4T
                  status: OUT_OF_STOCK
                - id: 8b2e4d1a-6c3f-4a9e-b1d7-5f0e2c3a4b6d
                  name: Atún en lata
                  unit: UNIT
                  stock: 2
                  salePrice: 6500
                  minStock: 5
                  codeType: GTIN
                  code: "7702004003508"
                  status: LOW_STOCK
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /products/{id}:
    get:
      tags: [Products]
      summary: Detalle de un producto (RF-15)
      operationId: getProduct
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: Producto con su estado de existencias.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryProduct"
        "400":
          description: "`VALIDATION_ERROR`: el id no es un UUID."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                validationError:
                  $ref: "#/components/examples/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ProductNotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    patch:
      tags: [Products]
      summary: Edita un producto (RF-07)
      description: |
        Cambia solo los campos que se envían. Se pueden editar `name`, `unit`, `salePrice` y
        `minStock`; `salePrice` y `minStock` aceptan `null` para quitarlos.

        La existencia (`stock`) **no se edita aquí**: solo cambia con un movimiento. El código y
        su tipo tampoco se pueden cambiar. Si llegan en el cuerpo, la respuesta es 400.
      operationId: updateProduct
      parameters:
        - $ref: "#/components/parameters/ProductId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductRequest"
            example:
              name: Arroz Diana 1 kg
              salePrice: 6800
      responses:
        "200":
          description: Producto actualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: |
            - `VALIDATION_ERROR`: el cuerpo está vacío, trae un campo no editable (`stock`,
              `code`, `codeType`) o un valor con formato inválido, o el id no es un UUID.
            - `INVALID_QUANTITY`: `salePrice` o `minStock` tienen más de 2 decimales.
            - `INVALID_JSON`: el cuerpo no es un JSON válido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                validationError:
                  $ref: "#/components/examples/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ProductNotFound"
        "409":
          description: |
            `INVALID_UNIT_CHANGE`: se pidió cambiar a `UNIT` y la existencia tiene decimales.
            No cambia nada; la app puede sugerir primero un ajuste a un número entero.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: INVALID_UNIT_CHANGE
                message: "No puedes cambiar a unidades: la existencia tiene decimales. Haz primero un ajuste."
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Products]
      summary: Da de baja un producto (RF-08)
      description: |
        Baja lógica: el producto deja de aparecer en el inventario, la búsqueda, la
        identificación por código y las alertas, pero **conserva su historial**. No hay borrado
        físico. Dar de baja un producto que ya estaba dado de baja responde 404.
      operationId: deactivateProduct
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "204":
          description: Producto dado de baja. Sin cuerpo.
        "400":
          description: "`VALIDATION_ERROR`: el id no es un UUID."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                validationError:
                  $ref: "#/components/examples/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ProductNotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /products/{id}/movements:
    get:
      tags: [Products]
      summary: Historial de movimientos de un producto (RF-15)
      description: |
        Movimientos del producto del más reciente al más antiguo, de 50 en 50 si no llega `limit`.
        Para pedir la página siguiente, la app envía en `cursor` el `nextCursor` de la respuesta
        anterior; cuando es `null`, no hay más.
      operationId: getMovementHistory
      parameters:
        - $ref: "#/components/parameters/ProductId"
        - name: cursor
          in: query
          required: false
          description: El `nextCursor` de la página anterior.
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          description: Cuántos movimientos devolver. Por defecto, 50.
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Una página del historial.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovementHistoryPage"
              example:
                items:
                  - id: 5e6f7081-92a4-4d1c-8b9e-3f1c2b9e4c1e
                    type: OUTBOUND
                    reason: SALE
                    quantity: 2
                    resultingStock: 22
                    createdAt: "2026-11-08T15:30:00.000Z"
                  - id: 1c2b9e4c-1e5e-4f70-8192-a44d8b9e3f1c
                    type: INBOUND
                    reason: null
                    quantity: 24
                    resultingStock: 24
                    createdAt: "2026-11-01T09:00:00.000Z"
                nextCursor: null
        "400":
          description: "`VALIDATION_ERROR`: el id o el cursor no son UUID, o `limit` no está entre 1 y 100."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                validationError:
                  $ref: "#/components/examples/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ProductNotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /reports/summary:
    get:
      tags: [Reports]
      summary: Resumen de ventas de hoy y de la semana
      description: |
        Total vendido hoy y en la semana, que empieza el lunes, en hora de Colombia, y los 5
        productos más vendidos de la semana.

        - El total usa el precio guardado en cada venta. Las ventas sin precio no suman y se
          cuentan aparte en `salesWithoutPrice`.
        - Las ventas deshechas no cuentan.
      operationId: getSalesSummary
      responses:
        "200":
          description: El resumen.
          content:
            application/json:
              schema:
                type: object
                required: [today, week, topProducts, salesWithoutPrice]
                properties:
                  today:
                    $ref: "#/components/schemas/PeriodSales"
                  week:
                    $ref: "#/components/schemas/PeriodSales"
                  topProducts:
                    type: array
                    items:
                      type: object
                      required: [name, unit, quantity, total]
                      properties:
                        name:
                          type: string
                        unit:
                          type: string
                          enum: [UNIT, KILOGRAM, GRAM, POUND, LITER]
                        quantity:
                          type: number
                        total:
                          type: number
                  salesWithoutPrice:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /reports/inventory:
    get:
      tags: [Reports]
      summary: Reporte de inventario actual, en Excel
      description: Productos activos con existencias, mínimo, precio, valor a precio de venta y estado.
      operationId: getInventoryReport
      responses:
        "200":
          $ref: "#/components/responses/ExcelReport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /reports/movements:
    get:
      tags: [Reports]
      summary: Reporte de movimientos de un período, en Excel
      description: |
        Todos los movimientos del período, también de productos eliminados. La cantidad lleva su
        signo y los movimientos deshechos quedan marcados.
      operationId: getMovementsReport
      parameters:
        - $ref: "#/components/parameters/ReportFrom"
        - $ref: "#/components/parameters/ReportTo"
      responses:
        "200":
          $ref: "#/components/responses/ExcelReport"
        "400":
          $ref: "#/components/responses/InvalidReportPeriod"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /reports/sales:
    get:
      tags: [Reports]
      summary: Reporte de ventas de un período, en Excel
      description: |
        Una hoja con el total por producto y otra con cada venta. Solo cuenta salidas por venta que
        no se deshicieron, con el precio que tenía el producto al venderse. Las ventas sin precio
        no suman y se cuentan aparte.
      operationId: getSalesReport
      parameters:
        - $ref: "#/components/parameters/ReportFrom"
        - $ref: "#/components/parameters/ReportTo"
      responses:
        "200":
          $ref: "#/components/responses/ExcelReport"
        "400":
          $ref: "#/components/responses/InvalidReportPeriod"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token que devuelven `/auth/register` y `/auth/login`. Vence según la configuración del
        servidor (7 días por defecto). Al vencer, la app debe volver a pedir el inicio de sesión.

        Toda ruta protegida responde 401 `UNAUTHORIZED` (ver `#/components/responses/Unauthorized`)
        si el token falta, es inválido o venció.

  parameters:
    ReportFrom:
      name: from
      in: query
      required: true
      description: Primer día del período (`AAAA-MM-DD`), en hora de Colombia.
      schema:
        type: string
        format: date
    ReportTo:
      name: to
      in: query
      required: true
      description: Último día del período, incluido. El período no puede pasar de 366 días.
      schema:
        type: string
        format: date
    ProductId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    PeriodSales:
      type: object
      required: [total, sales]
      properties:
        total:
          type: number
          description: Valor vendido, con el precio guardado en cada venta.
        sales:
          type: integer
          description: Número de ventas.

    DeletedProduct:
      type: object
      required: [id, name, unit, stock, salePrice, minStock, codeType, code, deletedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        unit:
          type: string
          enum: [UNIT, KILOGRAM, GRAM, POUND, LITER]
        stock:
          type: number
        salePrice:
          type: [number, "null"]
        minStock:
          type: [number, "null"]
        codeType:
          type: string
          enum: [GTIN, INTERNAL]
        code:
          type: string
        deletedAt:
          type: string
          format: date-time

    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - businessName
        - ownerName
        - email
        - password
        - passwordConfirmation
        - acceptDataPolicy
      properties:
        businessName:
          type: string
          minLength: 1
          maxLength: 80
          description: Nombre del negocio. Se le quitan los espacios de los extremos.
        ownerName:
          type: string
          minLength: 1
          maxLength: 80
          description: Nombre del responsable. Se le quitan los espacios de los extremos.
        email:
          type: string
          format: email
          maxLength: 254
          description: Se guarda sin espacios y en minúsculas.
        password:
          type: string
          minLength: 8
          format: password
        passwordConfirmation:
          type: string
          format: password
          description: Debe ser igual a `password`.
        acceptDataPolicy:
          type: boolean
          description: Debe ser `true` (Ley 1581 de 2012). Si llega `false`, responde 400 `DATA_POLICY_NOT_ACCEPTED`.

    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Se compara sin espacios y sin distinguir mayúsculas.
        password:
          type: string
          minLength: 1
          format: password
          description: No se valida la longitud mínima del registro; solo que no esté vacía.

    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Se compara sin espacios y sin distinguir mayúsculas.

    PasswordResetConfirm:
      type: object
      additionalProperties: false
      required: [email, code, newPassword]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        code:
          type: string
          pattern: '^\d{6}$'
          description: Los 6 dígitos del correo, como texto para conservar los ceros iniciales.
        newPassword:
          type: string
          minLength: 8
          format: password

    AuthResponse:
      type: object
      required: [token, user, business]
      properties:
        token:
          type: string
          description: "JWT para enviar en `Authorization: Bearer <token>`."
        user:
          type: object
          required: [ownerName, email]
          properties:
            ownerName:
              type: string
            email:
              type: string
              format: email
        business:
          type: object
          required: [name]
          properties:
            name:
              type: string

    CreateProductRequest:
      type: object
      additionalProperties: false
      required: [name, unit, stock]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
          description: Se guarda sin espacios al inicio ni al final.
        unit:
          $ref: "#/components/schemas/Unit"
        stock:
          type: number
          minimum: 0
          description: Existencia inicial. Máximo 2 decimales; entero si `unit` es `UNIT`.
        salePrice:
          type: number
          minimum: 0
          description: Precio de venta en pesos. Máximo 2 decimales.
        minStock:
          type: number
          minimum: 0
          description: Existencia mínima para las alertas. Máximo 2 decimales.
        code:
          type: string
          maxLength: 32
          description: GTIN de 8 o 13 dígitos ya normalizado. Si no se envía, el backend genera uno interno.

    Product:
      type: object
      required: [id, name, unit, stock, salePrice, minStock, codeType, code]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        unit:
          $ref: "#/components/schemas/Unit"
        stock:
          type: number
        salePrice:
          type: [number, "null"]
        minStock:
          type: [number, "null"]
        codeType:
          type: string
          enum: [GTIN, INTERNAL]
        code:
          type: string
          description: El GTIN enviado o el identificador interno `INV-XXXXXXXXXX` que va en el QR.

    Unit:
      type: string
      enum: [UNIT, KILOGRAM, GRAM, POUND, LITER]

    RegisterMovementRequest:
      type: object
      additionalProperties: false
      required: [productId, type, quantity, idempotencyKey]
      properties:
        productId:
          type: string
          format: uuid
        type:
          type: string
          enum: [INBOUND, OUTBOUND, ADJUSTMENT]
        quantity:
          type: number
          minimum: 0
          description: Lo que entra o sale; en un ajuste, lo contado.
        reason:
          type: string
          enum: [SALE, CONSUMPTION, LOSS]
          description: Obligatorio solo en `OUTBOUND`.
        idempotencyKey:
          type: string
          format: uuid
          description: UUID que la app genera por cada acción del usuario y repite al reintentar.

    Movement:
      type: object
      required: [id, productId, type, reason, quantity, resultingStock, createdAt]
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        type:
          type: string
          enum: [INBOUND, OUTBOUND, ADJUSTMENT]
        reason:
          type: [string, "null"]
          enum: [SALE, CONSUMPTION, LOSS, null]
        quantity:
          type: number
          description: Lo que entró o salió; en un ajuste, la diferencia (puede ser negativa).
        resultingStock:
          type: number
          description: Existencia del producto después del movimiento.
        createdAt:
          type: string
          format: date-time

    MovementResult:
      type: object
      required: [movement, stock]
      properties:
        movement:
          oneOf:
            - $ref: "#/components/schemas/Movement"
            - type: "null"
        stock:
          type: number
          description: Existencia actual del producto. La app actualiza la pantalla con este valor.

    InventoryProduct:
      allOf:
        - $ref: "#/components/schemas/Product"
        - type: object
          required: [status]
          properties:
            status:
              $ref: "#/components/schemas/StockStatus"

    StockStatus:
      type: string
      enum: [OUT_OF_STOCK, LOW_STOCK, OK]
      description: |
        - `OUT_OF_STOCK`: la existencia es 0.
        - `LOW_STOCK`: tiene existencia mínima y la existencia es igual o menor.
        - `OK`: cualquier otro caso.

    HistoryMovement:
      type: object
      required: [id, type, reason, quantity, resultingStock, createdAt]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [INBOUND, OUTBOUND, ADJUSTMENT]
        reason:
          type: [string, "null"]
          enum: [SALE, CONSUMPTION, LOSS, null]
        quantity:
          type: number
          description: Lo que entró o salió; en un ajuste, la diferencia (puede ser negativa).
        resultingStock:
          type: number
        createdAt:
          type: string
          format: date-time

    MovementHistoryPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/HistoryMovement"
        nextCursor:
          type: [string, "null"]
          format: uuid

    UpdateProductRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
        unit:
          $ref: "#/components/schemas/Unit"
        salePrice:
          type: [number, "null"]
          minimum: 0
          description: Máximo 2 decimales. `null` quita el precio.
        minStock:
          type: [number, "null"]
          minimum: 0
          description: Máximo 2 decimales. `null` quita la existencia mínima (deja de generar alertas por agotarse).

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Código estable en inglés. La app decide qué hacer según este valor.
          enum:
            - VALIDATION_ERROR
            - INVALID_JSON
            - DATA_POLICY_NOT_ACCEPTED
            - EMAIL_ALREADY_REGISTERED
            - INVALID_CREDENTIALS
            - TOO_MANY_LOGIN_ATTEMPTS
            - INVALID_RESET_CODE
            - EMAIL_NOT_SENT
            - UNAUTHORIZED
            - NOT_FOUND
            - INVALID_GTIN
            - INVALID_QUANTITY
            - CODE_ALREADY_REGISTERED
            - CODE_OF_DELETED_PRODUCT
            - REPORT_TOO_LARGE
            - CODE_NOT_RECOGNIZED
            - PRODUCT_NOT_FOUND
            - INVALID_UNIT_CHANGE
            - INSUFFICIENT_STOCK
            - IDEMPOTENCY_KEY_CONFLICT
            - INTERNAL_ERROR
        message:
          type: string
          description: Mensaje en español, listo para mostrar al usuario.

  examples:
    ValidationError:
      summary: Datos inválidos
      value:
        code: VALIDATION_ERROR
        message: Los datos enviados no son válidos.
    InvalidJson:
      summary: JSON mal formado
      value:
        code: INVALID_JSON
        message: La petición no tiene un formato válido.

  responses:
    ExcelReport:
      description: El archivo de Excel.
      content:
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
          schema:
            type: string
            format: binary
    InvalidReportPeriod:
      description: |
        - `VALIDATION_ERROR`: faltan las fechas, no son válidas, `to` es anterior a `from` o el
          período pasa de 366 días.
        - `REPORT_TOO_LARGE`: hay demasiados datos. Hay que elegir un período más corto.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: REPORT_TOO_LARGE
            message: Este reporte tiene demasiados datos. Elige un período más corto.
    ProductNotFound:
      description: "`PRODUCT_NOT_FOUND`: el producto no existe, fue dado de baja o pertenece a otro negocio."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: PRODUCT_NOT_FOUND
            message: Este producto no está en tu inventario.
    Unauthorized:
      description: |
        La ruta es protegida y no hay una sesión válida. Se responde igual en todos los casos,
        sin indicar cuál ocurrió:

        - Falta la cabecera `Authorization`.
        - La cabecera no usa el esquema `Bearer` o no trae token después de `Bearer `.
        - El token está mal formado, tiene una firma inválida o venció.
        - El token no trae el usuario o el negocio.

        La app debe cerrar la sesión local y llevar al usuario al inicio de sesión.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: UNAUTHORIZED
            message: Tu sesión terminó. Ingresa de nuevo.
    InternalError:
      description: Error inesperado del servidor. No se exponen detalles.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: INTERNAL_ERROR
            message: Ocurrió un error inesperado. Intenta de nuevo.
