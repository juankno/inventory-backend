openapi: 3.1.0
info:
  title: Surtido API
  version: 0.1.0
  description: |
    API REST de la app móvil de gestión de inventarios para micronegocios.

    - Todas las rutas van bajo `/api/v1` y usan JSON.
    - Los errores siempre tienen el cuerpo `{ code, message }`: `code` es estable y en inglés
      (la app decide qué hacer con él) y `message` está en español, listo para mostrar al usuario.
    - Las rutas protegidas exigen `Authorization: Bearer <token>`. Las únicas públicas son
      `/auth/*` y `/health`.

    Este documento solo incluye los endpoints ya implementados.
servers:
  - url: https://surtido-api.vercel.app/api/v1
    description: Producción
  - url: http://localhost:3000/api/v1
    description: Desarrollo local
security:
  - bearerAuth: []
tags:
  - name: Health
    description: Estado del servicio
  - name: Auth
    description: Registro, inicio de sesión y restablecimiento de la contraseña del comerciante

paths:
  /health:
    get:
      tags: [Health]
      summary: Verifica que la API está en línea
      operationId: getHealth
      security: []
      responses:
        "200":
          description: La API responde.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
              example:
                status: ok

  /auth/register:
    post:
      tags: [Auth]
      summary: Registra la cuenta de un negocio (RF-01)
      description: |
        Crea el negocio y su usuario en una sola operación y deja la sesión abierta:
        la respuesta ya trae el token.

        - El correo se guarda sin espacios y en minúsculas, y es único en todo el sistema.
        - La contraseña se guarda solo como hash.
        - Se registra la fecha en que se aceptó la política de datos.
      operationId: registerAccount
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            example:
              businessName: Tienda Doña Rosa
              ownerName: Rosa Martínez
              email: rosa@correo.com
              password: secreta123
              passwordConfirmation: secreta123
              acceptDataPolicy: true
      responses:
        "201":
          description: Cuenta creada. La sesión queda abierta con el token devuelto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
              example:
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJidXNpbmVzc0lkIjoiLi4uIiwic3ViIjoiLi4uIn0.firma
                user:
                  ownerName: Rosa Martínez
                  email: rosa@correo.com
                business:
                  name: Tienda Doña Rosa
        "400":
          description: |
            La petición no se puede procesar:

            - `VALIDATION_ERROR`: falta un campo, sobra un campo, un valor no cumple el formato
              o la confirmación no coincide con la contraseña. No se indica qué campo falló:
              la app valida campo a campo antes de enviar.
            - `INVALID_JSON`: el cuerpo no es un JSON válido.
            - `DATA_POLICY_NOT_ACCEPTED`: `acceptDataPolicy` llegó en `false`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                validationError:
                  $ref: "#/components/examples/ValidationError"
                invalidJson:
                  $ref: "#/components/examples/InvalidJson"
                dataPolicyNotAccepted:
                  summary: Política de datos no aceptada
                  value:
                    code: DATA_POLICY_NOT_ACCEPTED
                    message: Debes aceptar la política de datos para continuar.
        "409":
          description: Ya existe una cuenta con ese correo (sin importar mayúsculas ni espacios).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: EMAIL_ALREADY_REGISTERED
                message: Ya existe una cuenta con este correo. Inicia sesión o usa otro correo.
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/login:
    post:
      tags: [Auth]
      summary: Inicia sesión con correo y contraseña (RF-02)
      description: |
        Verifica las credenciales del comerciante y devuelve un token nuevo junto con los datos
        básicos del usuario y del negocio. La respuesta tiene la misma forma que la de
        `/auth/register`.

        - El correo se compara sin espacios y sin distinguir mayúsculas.
        - Si el correo no existe o la contraseña no coincide, la respuesta es la misma
          (`INVALID_CREDENTIALS`), para no revelar qué correos están registrados.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: rosa@correo.com
              password: secreta123
      responses:
        "200":
          description: Credenciales válidas. La sesión queda abierta con el token devuelto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
              example:
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJidXNpbmVzc0lkIjoiLi4uIiwic3ViIjoiLi4uIn0.firma
                user:
                  ownerName: Rosa Martínez
                  email: rosa@correo.com
                business:
                  name: Tienda Doña Rosa
        "400":
          description: |
            La petición no se puede procesar:

            - `VALIDATION_ERROR`: falta un campo, sobra un campo, el correo no tiene formato
              válido o la contraseña llegó vacía.
            - `INVALID_JSON`: el cuerpo no es un JSON válido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                validationError:
                  $ref: "#/components/examples/ValidationError"
                invalidJson:
                  $ref: "#/components/examples/InvalidJson"
        "401":
          description: El correo no está registrado o la contraseña es incorrecta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: INVALID_CREDENTIALS
                message: Correo o contraseña incorrectos.
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/password-reset/request:
    post:
      tags: [Auth]
      summary: Envía un código para restablecer la contraseña (RF-04)
      description: |
        Envía al correo un código de 6 dígitos para cambiar la contraseña.

        - Responde 204 exista o no la cuenta, para no revelar qué correos están registrados.
        - El código vence en 15 minutos, sirve una sola vez y se guarda solo como hash.
        - Pedir un código nuevo anula el anterior. Si se pidió otro hace menos de un minuto,
          no se envía nada, pero la respuesta también es 204.
        - El correo se envía con Resend. Sin `RESEND_API_KEY`, en desarrollo se escribe en la
          consola del servidor; en producción responde 500 `EMAIL_NOT_SENT`.
      operationId: requestPasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
            example:
              email: rosa@correo.com
      responses:
        "204":
          description: Si el correo tiene una cuenta, el código va en camino.
        "400":
          description: |
            - `VALIDATION_ERROR`: falta el correo, sobra un campo o el correo no tiene formato válido.
            - `INVALID_JSON`: el cuerpo no es un JSON válido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                validationError:
                  $ref: "#/components/examples/ValidationError"
                invalidJson:
                  $ref: "#/components/examples/InvalidJson"
        "500":
          description: |
            - `EMAIL_NOT_SENT`: el proveedor de correo no respondió o rechazó el envío. Se puede
              pedir otro código de inmediato.
            - `INTERNAL_ERROR`: error inesperado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: EMAIL_NOT_SENT
                message: No pudimos enviar el correo. Intenta de nuevo en unos minutos.

  /auth/password-reset/confirm:
    post:
      tags: [Auth]
      summary: Cambia la contraseña con el código recibido (RF-04)
      description: |
        Cambia la contraseña si el código es el último enviado al correo, no ha vencido y no se
        ha usado. No abre sesión: la app lleva al inicio de sesión.

        - Después de 5 intentos con un código equivocado, el código deja de servir.
        - Cualquier falla responde `INVALID_RESET_CODE`, sin indicar si el correo existe.
      operationId: confirmPasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConfirm"
            example:
              email: rosa@correo.com
              code: "482915"
              newPassword: nuevaClave99
      responses:
        "204":
          description: La contraseña cambió.
        "400":
          description: |
            - `INVALID_RESET_CODE`: el código es incorrecto, venció, ya se usó, se agotaron los
              intentos o el correo no tiene cuenta.
            - `VALIDATION_ERROR`: el código no tiene 6 dígitos, la contraseña nueva tiene menos
              de 8 caracteres, falta o sobra un campo.
            - `INVALID_JSON`: el cuerpo no es un JSON válido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalidResetCode:
                  summary: Código inválido
                  value:
                    code: INVALID_RESET_CODE
                    message: El código no es válido o ya venció. Pide uno nuevo.
                validationError:
                  $ref: "#/components/examples/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token que devuelven `/auth/register` y `/auth/login`. Vence según la configuración del
        servidor (7 días por defecto). Al vencer, la app debe volver a pedir el inicio de sesión.

        Toda ruta protegida responde 401 `UNAUTHORIZED` (ver `#/components/responses/Unauthorized`)
        si el token falta, es inválido o venció.

  schemas:
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - businessName
        - ownerName
        - email
        - password
        - passwordConfirmation
        - acceptDataPolicy
      properties:
        businessName:
          type: string
          minLength: 1
          maxLength: 80
          description: Nombre del negocio. Se le quitan los espacios de los extremos.
        ownerName:
          type: string
          minLength: 1
          maxLength: 80
          description: Nombre del responsable. Se le quitan los espacios de los extremos.
        email:
          type: string
          format: email
          maxLength: 254
          description: Se guarda sin espacios y en minúsculas.
        password:
          type: string
          minLength: 8
          format: password
        passwordConfirmation:
          type: string
          format: password
          description: Debe ser igual a `password`.
        acceptDataPolicy:
          type: boolean
          description: Debe ser `true` (Ley 1581 de 2012). Si llega `false`, responde 400 `DATA_POLICY_NOT_ACCEPTED`.

    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Se compara sin espacios y sin distinguir mayúsculas.
        password:
          type: string
          minLength: 1
          format: password
          description: No se valida la longitud mínima del registro; solo que no esté vacía.

    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Se compara sin espacios y sin distinguir mayúsculas.

    PasswordResetConfirm:
      type: object
      additionalProperties: false
      required: [email, code, newPassword]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        code:
          type: string
          pattern: '^\d{6}$'
          description: Los 6 dígitos del correo, como texto para conservar los ceros iniciales.
        newPassword:
          type: string
          minLength: 8
          format: password

    AuthResponse:
      type: object
      required: [token, user, business]
      properties:
        token:
          type: string
          description: "JWT para enviar en `Authorization: Bearer <token>`."
        user:
          type: object
          required: [ownerName, email]
          properties:
            ownerName:
              type: string
            email:
              type: string
              format: email
        business:
          type: object
          required: [name]
          properties:
            name:
              type: string

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Código estable en inglés. La app decide qué hacer según este valor.
          enum:
            - VALIDATION_ERROR
            - INVALID_JSON
            - DATA_POLICY_NOT_ACCEPTED
            - EMAIL_ALREADY_REGISTERED
            - INVALID_CREDENTIALS
            - INVALID_RESET_CODE
            - EMAIL_NOT_SENT
            - UNAUTHORIZED
            - NOT_FOUND
            - INTERNAL_ERROR
        message:
          type: string
          description: Mensaje en español, listo para mostrar al usuario.

  examples:
    ValidationError:
      summary: Datos inválidos
      value:
        code: VALIDATION_ERROR
        message: Los datos enviados no son válidos.
    InvalidJson:
      summary: JSON mal formado
      value:
        code: INVALID_JSON
        message: La petición no tiene un formato válido.

  responses:
    Unauthorized:
      description: |
        La ruta es protegida y no hay una sesión válida. Se responde igual en todos los casos,
        sin indicar cuál ocurrió:

        - Falta la cabecera `Authorization`.
        - La cabecera no usa el esquema `Bearer` o no trae token después de `Bearer `.
        - El token está mal formado, tiene una firma inválida o venció.
        - El token no trae el usuario o el negocio.

        La app debe cerrar la sesión local y llevar al usuario al inicio de sesión.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: UNAUTHORIZED
            message: Tu sesión terminó. Ingresa de nuevo.
    InternalError:
      description: Error inesperado del servidor. No se exponen detalles.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: INTERNAL_ERROR
            message: Ocurrió un error inesperado. Intenta de nuevo.
